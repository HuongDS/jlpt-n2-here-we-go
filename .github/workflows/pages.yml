name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p site
          python - <<'PY'
          from html import escape
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          lines = []
          for line in readme.splitlines():
              if line.startswith("### "):
                  lines.append(f"<h3>{escape(line[4:])}</h3>")
              elif line.startswith("## "):
                  lines.append(f"<h2>{escape(line[3:])}</h2>")
              elif line.startswith("# "):
                  lines.append(f"<h1>{escape(line[2:])}</h1>")
              elif line.startswith("```"):
                  continue
              elif line.strip():
                  lines.append(f"<p>{escape(line)}</p>")

          page = """<!doctype html>
          <html lang="vi">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>JLPT N2 - He Thong On Tap Tu Vung</title>
            <style>
              :root { color-scheme: light; font-family: system-ui, sans-serif; }
              body { margin: 0 auto; max-width: 900px; padding: 2rem 1rem 4rem; line-height: 1.6; color: #24292f; }
              h1, h2, h3 { line-height: 1.25; margin-top: 2rem; }
              h1 { margin-top: 0; }
              p { white-space: pre-wrap; }
              code { background: #f6f8fa; padding: .15rem .3rem; border-radius: 4px; }
            </style>
          </head>
          <body>
          """ + "\n".join(lines) + """
          </body>
          </html>
          """
          Path("site/index.html").write_text(page, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
